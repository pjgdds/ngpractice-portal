<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Account | ngpractice</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-xl shadow max-w-md w-full">
  <h1 class="text-2xl font-bold text-center mb-4 text-blue-800">Create your account</h1>
  <p class="text-center text-gray-600 mb-6">Complete forms before you arrive and manage your care.</p>
  <a href="#" class="block w-full bg-blue-600 text-white text-center py-3 rounded-lg font-semibold mb-4">Continue with Google</a>
  <p class="text-center text-sm text-gray-500 mb-4">or</p>
  <form class="space-y-4">
    <input type="email" placeholder="Email" class="w-full border rounded px-3 py-2" required>
    <input type="password" placeholder="Password" class="w-full border rounded px-3 py-2" required>
    <button type="submit" class="w-full bg-gray-800 text-white py-3 rounded-lg">Create Account</button>
  </form>
  <p class="text-center mt-4 text-sm"><a href="/login" class="text-blue-600">Already have an account? Log in</a></p>
</div>
</body>
</html>
